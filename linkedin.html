<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
  (function() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Ayush Das | LinkedIn Posts</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,700&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button:focus, button:active { outline: none !important; }
  button::-moz-focus-inner { border: 0 !important; }

  :root {
    --ink: #0a0a0a;
    --paper: #ffffff;
    --mid: #555555;
    --border: #e2e2e2;
    --serif: 'Playfair Display', Georgia, serif;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  [data-theme="dark"] {
    --ink: #f0eeea;
    --paper: #0d0d0d;
    --mid: #aaaaaa;
    --border: #282828;
  }

  html, body { overflow: visible !important; min-height: 100vh !important; height: auto !important; position: relative !important; display: flex; flex-direction: column; }

  body {
    background-color: var(--paper);
    background-image: radial-gradient(circle, rgba(100,100,100,0.18) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    transition: background-color 0.4s, color 0.4s;
  }
  [data-theme="dark"] body {
    background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 3rem;
    height: 72px;
    background: var(--paper);
    transition: background 0.4s, border-color 0.4s;
  }
  .nav-logo {
    font-family: var(--serif);
    font-size: clamp(1.5rem, 3vw, 2rem);
    letter-spacing: 0.04em;
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 2.6rem;
    min-width: 5rem;
    overflow: visible;
    flex-shrink: 0;
  }
  #nav-gooey-inner {
    display: flex;
    align-items: center;
    filter: url(#nav-threshold);
    height: 100%;
    position: relative;
    min-width: 10rem;
  }
  #nav-gt1, #nav-gt2 {
    position: absolute;
    font-family: var(--serif);
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
    white-space: nowrap;
    user-select: none;
    transition: color 0.4s;
    left: 0;
    line-height: 1;
  }
  .nav-right { display: flex; align-items: center; gap: 2.5rem; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #444;
    text-decoration: none;
    transition: color 0.2s;
    cursor: pointer;
  }
  [data-theme="dark"] .nav-links a { color: #aaa; }
  .nav-links a:hover { color: var(--ink); }


  /* ── DETAIL WRAP (matches school.html pattern) ── */
  .detail-wrap { flex: 1; display: flex; flex-direction: column; width: 100%; padding-top: 88px; padding-bottom: 0; box-sizing: border-box; }
  .content { margin: 0 auto; width: 100%; max-width: 860px; padding: 0 3rem; box-sizing: border-box; position: relative; }

  .footer {
    margin-top: 5px;
    font-family: "Helvetica", "Helvetica-Bold", "Arial", sans-serif;
    font-size: 0.65rem;
    font-weight: bold;
    color: var(--ink);
    text-align: center;
    letter-spacing: 0.08em;
    transition: color 0.4s;
  }
  @media (max-width: 680px) {
    .footer { display: none; }
  }
  .bottom-branding {
    width: 100%;
    text-align: center;
    padding: 1rem 0 0.6rem 0;
    pointer-events: none;
    margin-top: auto;
  }


  .section-heading {
    font-family: var(--serif);
    font-size: clamp(1.9rem, 4vw, 3.2rem);
    font-weight: 700;
    line-height: 1.05;
    color: var(--ink);
    margin-bottom: 1.6rem;
  }
  .section-heading em { font-style: italic; font-weight: 400; }

  .proj-awards {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-top: 0.1rem;
    margin-bottom: 2rem;
  }
  .proj-award-item {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #c97a10;
    width: fit-content;
    line-height: 1.3;
  }
  [data-theme="dark"] .proj-award-item {
    color: #ffc44a;
  }
  .proj-award-item .award-medal {
    width: 1.1rem;
    height: 1.1rem;
    flex-shrink: 0;
  }

  /* ══════════════ STAR BUTTON ══════════════ */
  .star-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border-radius: 9999px;
    padding: 5px 13px;
    font-family: var(--mono);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    background: transparent;
    border: 1px solid var(--ink);
    outline: none;
    color: var(--ink);
    box-shadow: 0 0 8px rgba(0,0,0,0.2), 0 0 20px rgba(0,0,0,0.08);
    transition: background 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .star-btn:hover {
    background: var(--ink);
    color: var(--paper);
    transform: translateY(-1px);
    box-shadow: 0 0 12px rgba(0,0,0,0.35), 0 0 30px rgba(0,0,0,0.15), 0 4px 16px rgba(0,0,0,0.18);
  }
  [data-theme="dark"] .star-btn {
    border-color: rgba(255,255,255,0.85);
    color: #f0eeea;
    box-shadow: 0 0 8px rgba(255,255,255,0.25), 0 0 20px rgba(255,255,255,0.1);
  }
  [data-theme="dark"] .star-btn:hover {
    background: rgba(255,255,255,0.08);
    color: #ffffff;
    box-shadow: 0 0 12px rgba(255,255,255,0.5), 0 0 30px rgba(255,255,255,0.2), 0 4px 16px rgba(255,255,255,0.1);
  }


  @keyframes scroll-right {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .cert-scroll-container {
    mask: linear-gradient(90deg, transparent 0%, black 5%, black 95%, transparent 100%);
    -webkit-mask: linear-gradient(90deg, transparent 0%, black 5%, black 95%, transparent 100%);
    overflow: hidden;
    width: 100%;
    position: relative;
    padding: 20px 0;
  }
  .cert-infinite-scroll {
    display: flex;
    gap: 1rem;
    width: max-content;
    animation: scroll-right 45s linear infinite;
  }
  @media (hover: hover) {
    .cert-infinite-scroll:hover { animation-play-state: paused; }
  }

  .cert-item {
    flex-shrink: 0;
    width: 302px;
    height: 377px;
    border-radius: 8px;
    overflow: hidden;
    border: none;
    transition: transform 0.3s ease, filter 0.3s ease;
    background-color: transparent;
    position: relative;
  }
  .cert-item:hover {
    transform: scale(1.05);
    filter: brightness(1.1);
    z-index: 10;
    position: relative;
  }
  .cert-item img, .cert-item video {
    width: auto;
    height: 100%;
    object-fit: contain;
    background-color: transparent;
    display: block;
    border-radius: 8px;
  }
  .cert-item iframe {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 504px !important;
    height: 628px !important;
    transform: scale(0.6);
    transform-origin: top left;
    border: none;
  }

  video::-webkit-media-controls-start-playback-button,
  video::-webkit-media-controls {
    display: none !important;
    -webkit-appearance: none !important;
  }

  @media (max-width: 680px) {
    html, body {
      height: auto;
      overflow: auto;
    }
    nav { padding: 0.8rem 1.2rem; height: 60px; }
    .detail-wrap { padding-top: 90px; }
    .content { padding: 0 1.4rem; }
    .nav-logo { display: none; }
    .nav-links {
      display: block;
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
    }
    .nav-right { width: 100%; justify-content: flex-end; }
    .cert-item {
      width: 302px;
      height: 377px;
      max-width: none;
    }
    .cert-item-video { display: none; }
    .project-desc { font-size: 0.75rem !important; }
  }


  .loader-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 32px;
    height: 32px;
  }
  .loader {
    position: relative;
    width: 160px;
    height: 160px;
    border: 4px solid var(--paper);
    overflow: hidden;
    border-radius: 50%;
    box-shadow: -5px -5px 5px rgba(255, 255, 255, 0.1),
      10px 10px 10px rgba(0, 0, 0, 0.4),
      inset -5px -5px 5px rgba(255, 255, 255, 0.2),
      inset 10px 10px 10px rgba(0, 0, 0, 0.4);
    transform: scale(0.2);
    flex-shrink: 0;
  }
  .loader:before {
    content: "";
    position: absolute;
    top: 25px;
    left: 25px;
    right: 25px;
    bottom: 25px;
    z-index: 10;
    background: var(--paper);
    border-radius: 50%;
    border: 2px solid var(--paper);
    box-shadow: inset -2px -2px 5px rgba(255, 255, 255, 0.2),
      inset 3px 3px 5px rgba(0, 0, 0, 0.5);
  }
  .loader span {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background-image: linear-gradient(-225deg, #ff7402 0%, #ffe700 50%, #fff55e 100%);
    filter: blur(20px);
    z-index: -1;
    animation: animateLoader 0.5s linear infinite;
  }
  @keyframes animateLoader {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<nav>
  <ul class="nav-links"><li><a href="index.html">← Back to Portfolio</a></li></ul>
  <div class="nav-right">
    <a href="linkedin.html" class="loader-wrapper" style="cursor: pointer; text-decoration: none;">
      <div class="loader">
        <span></span>
      </div>
    </a>


  </div>
</nav>

<div class="detail-wrap">
  <div class="content" style="position:relative;z-index:1;">

      <div>    
        <h2 class="section-heading">My LinkedIn<br><em>Posts</em></h2>
        <p class="project-desc" style="font-size: 1rem; color: var(--mid); line-height: 1.6; max-width: 600px; margin-bottom: 2rem;">
          A collection of my recent thoughts, articles, and updates shared on LinkedIn.
        </p>

      <div class="cert-scroll-container" id="certScrollContainer">
        <div class="cert-infinite-scroll" id="certInfiniteScroll">
          <div class="cert-item" style="border:none; background:transparent;">
            <iframe src="https://www.linkedin.com/embed/feed/update/urn:li:ugcPost:7499790749237170176?collapsed=1" height="628" width="504" frameborder="0" allowfullscreen="" title="Embedded post"></iframe>
          </div>
          <div class="cert-item" style="border:none; background:transparent;">
            <iframe src="https://www.linkedin.com/embed/feed/update/urn:li:ugcPost:7499790749237170176?collapsed=1" height="628" width="504" frameborder="0" allowfullscreen="" title="Embedded post"></iframe>
          </div>
          <div class="cert-item" style="border:none; background:transparent;">
            <iframe src="https://www.linkedin.com/embed/feed/update/urn:li:ugcPost:7499790749237170176?collapsed=1" height="628" width="504" frameborder="0" allowfullscreen="" title="Embedded post"></iframe>
          </div>
        </div>
      </div>

  </div>
  <div class="bottom-branding">
    <p class="footer">&copy; <span class="year"></span> Ayush Das. All rights reserved.</p>
  </div>
</div>

<script>
  document.querySelectorAll(".year").forEach(el => el.textContent = new Date().getFullYear());
  const switchBtn  = document.getElementById('switchBtn');

  const savedTheme = localStorage.getItem('theme') || 'dark';
  if (switchBtn) {
    switchBtn.setAttribute('aria-checked', savedTheme === 'dark' ? 'true' : 'false');
  }

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    if (switchBtn) switchBtn.setAttribute('aria-checked', String(!isDark));
  }



  (function () {
    const scroll = document.getElementById('certInfiniteScroll');
    if (!scroll) return;

    Array.from(scroll.children).forEach(item => {
      const clone = item.cloneNode(true);
      clone.classList.add('duplicate');
      scroll.appendChild(clone);
    });

    const isMobile = window.matchMedia('(max-width: 680px)').matches;
    if (isMobile) return;

    function attachVideoObserver(video) {
      video.currentTime = 0;
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const p = entry.target.play();
            if (p !== undefined) {
              p.catch(() => {
                const retry = () => {
                  entry.target.play().catch(() => {});
                  document.removeEventListener('touchstart', retry);
                  document.removeEventListener('click', retry);
                };
                document.addEventListener('touchstart', retry, { once: true });
                document.addEventListener('click', retry, { once: true });
              });
            }
          } else {
            entry.target.pause();
          }
        });
      }, { root: scroll.parentElement, threshold: 0.3 });
      observer.observe(video);
    }

    scroll.querySelectorAll('video.carousel-video').forEach(attachVideoObserver);
  })();



</script>
</body>
</html>
