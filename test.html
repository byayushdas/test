  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --text-muted: #e0e0e0;
      --font-heading: 'DM Serif Display', serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 100px;
      max-width: 1200px;
      padding: 40px;
      width: 100%;
    }

    .text-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .main-title {
      font-family: var(--font-heading);
      font-size: 5.5rem;
      font-weight: 400;
      color: #ffffff;
      margin-bottom: 50px;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .contact-item svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-color);
      fill: none;
      stroke-width: 1.2;
    }

    .social-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .social-icon {
      width: 24px;
      height: 24px;
      transition: opacity 0.2s;
    }
    
    .social-icon:hover {
      opacity: 0.8;
      cursor: pointer;
    }

    .image-card {
      width: 400px;
      height: 560px;
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .resume-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
      padding: 10px 20px;
      background-color: #1a1a1a;
      border: 1px solid #333333;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background-color 0.2s, border-color 0.2s;
    }
    
    .resume-btn:hover {
      background-color: #2a2a2a;
      border-color: #555555;
    }

    .resume-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform: rotate(-5deg);
    }

    @media (max-width: 950px) {
      .container {
        flex-direction: column-reverse;
        text-align: center;
        gap: 60px;
      }
      .text-content {
        align-items: center;
        margin-top: 0;
      }
      .main-title {
        font-size: 4rem;
      }
    }
    
    @media (max-width: 500px) {
      .image-card {
        width: 100%;
        max-width: 340px;
        height: 480px;
      }
      .main-title {
        font-size: 3rem;
      }
    }
  </style>
</head>
