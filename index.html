<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush Das | Portfolio</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.6);
            --primary-accent: #3b82f6;
            --secondary-accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background glow */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            animation: float 10s infinite alternate;
        }
        
        body::before {
            background: rgba(59, 130, 246, 0.3);
            top: -10%;
            left: -10%;
        }

        body::after {
            background: rgba(139, 92, 246, 0.3);
            bottom: -10%;
            right: -10%;
            animation-delay: 5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2rem;
            padding: 4rem;
            max-width: 1100px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            gap: 4rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .left-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.25rem;
            color: var(--text-muted);
            font-weight: 300;
            max-width: 90%;
            line-height: 1.6;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 1.5rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .social-link:hover {
            transform: translateY(-8px) scale(1.1);
            color: white;
            border-color: transparent;
            box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4);
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .right-col {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
        }
        
        .image-wrapper::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 2rem;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            opacity: 0.3;
            filter: blur(20px);
            z-index: -1;
            transition: opacity 0.5s ease;
        }

        .image-wrapper:hover::before {
            opacity: 0.6;
        }

        .profile-img {
            width: 100%;
            border-radius: 2rem;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .profile-img:hover {
            transform: scale(1.03) translateY(-5px);
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column-reverse;
                text-align: center;
                padding: 3rem 2rem;
                gap: 3rem;
                overflow-y: auto;
            }
            
            body {
                overflow: auto;
                align-items: flex-start;
                padding: 2rem 0;
            }

            .left-col {
                align-items: center;
            }

            p {
                max-width: 100%;
            }

            h1 {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-col">
            <h1>Ayush Das</h1>
            <p>Welcome to my personal space. I'm passionate about creating beautiful, functional, and engaging digital experiences.</p>
            <div class="social-links">
                <a href="https://linkedin.com" target="_blank" class="social-link" title="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="https://github.com" target="_blank" class="social-link" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://twitter.com" target="_blank" class="social-link" title="Twitter">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <a href="https://instagram.com" target="_blank" class="social-link" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="mailto:ayush@example.com" class="social-link" title="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </div>
        <div class="right-col">
            <div class="image-wrapper">
                <img src="profile.webp" alt="Ayush Das" class="profile-img">
            </div>
        </div>
    </div>
</body>
</html>
