<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush Das</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            align-items: center;
            justify-content: space-between;
            padding: 2rem;
        }

        .left-col {
            flex: 1;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 1rem 0;
            font-weight: normal;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .social-icon {
            color: #a0a0a0;
            font-size: 1.5rem;
            text-decoration: none;
            position: relative;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon:hover {
            color: #fff;
        }

        /* Tooltip */
        .social-icon::after {
            content: attr(data-name);
            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1f1f1f;
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.875rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            pointer-events: none;
            border: 1px solid #333;
        }

        .social-icon:hover::after {
            opacity: 1;
            visibility: visible;
        }

        .right-col {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .right-col img {
            max-width: 300px;
            width: 100%;
            height: auto;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse;
                text-align: left;
                gap: 2rem;
                justify-content: center;
            }
            .right-col {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-col">
            <h1>Ayush Das</h1>
            <div class="social-links">
                <a href="#" class="social-icon" data-name="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="#" class="social-icon" data-name="LeetCode">
                    <i class="fas fa-code"></i>
                </a>
                <a href="#" class="social-icon" data-name="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="#" class="social-icon" data-name="X">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
            </div>
        </div>
        <div class="right-col">
            <img src="assets/profile.webp" alt="Ayush Das">
        </div>
    </div>
</body>
</html>
