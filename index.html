<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #0a0a0a;
            --nav-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --text-color: #f5f5f5;
            --nav-bg: rgba(10, 10, 10, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 0;
            position: sticky;
            top: 0;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
        }

        .switch-wrap {
            display: inline-block;
        }
        .switch-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            width: 44px;
            height: 24px;
            border-radius: 12px;
            background: #e2e2e2;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            transition: background 0.35s cubic-bezier(.4,0,.2,1);
            flex-shrink: 0;
        }
        .switch-btn[aria-checked="true"] {
            background: #1a1a1a;
        }
        [data-theme="dark"] .switch-btn[aria-checked="false"] {
            background: #333;
        }
        [data-theme="dark"] .switch-btn[aria-checked="true"] {
            background: #2a2a2a;
        }
        .switch-thumb {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #1a1a1a;
            left: 2px;
            transition: transform 0.35s cubic-bezier(.4,0,.2,1), background 0.3s;
            will-change: transform;
        }
        .switch-btn[aria-checked="true"] .switch-thumb {
            transform: translateX(20px);
            background: #fde047;
            box-shadow: 0 0 10px 2px rgba(253,224,71,0.55);
        }
        [data-theme="dark"] .switch-thumb { background: #f0eeea; }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            padding: 4rem 0;
            min-height: calc(100vh - 100px);
        }

        .column-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .column-right {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Placeholder styles to make it look like the layout */
        .placeholder-box {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border: 2px dashed var(--text-color);
            opacity: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                padding: 2rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <strong>Logo</strong>
            </div>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Projects</a>
                <div class="switch-wrap" onclick="toggleTheme()">
                    <button class="switch-btn" role="switch" aria-checked="true" aria-label="Toggle dark mode">
                        <span class="switch-thumb"></span>
                    </button>
                </div>
            </nav>
        </header>

        <main class="main-content">
            <div class="column-left">
                <h1>Left Column</h1>
                <p>Content will go here later.</p>
            </div>
            <div class="column-right">
                <div class="placeholder-box">
                    Right Column Image/Content Area
                </div>
            </div>
        </main>
    </div>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const switchBtn = document.querySelector('.switch-btn');
        if (switchBtn) {
            switchBtn.setAttribute('aria-checked', savedTheme === 'dark' ? 'true' : 'false');
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            if (switchBtn) {
                switchBtn.setAttribute('aria-checked', next === 'dark' ? 'true' : 'false');
            }
        }
    </script>
</body>
</html>
